services:
  backend:
    build:
      context: ./prob-bellkat-with-server
      dockerfile: Dockerfile
      target: backend
    image: pbkat-backend:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pbkat-frontend:local
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

